<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Calidad del Aire</title>
    <!-- Librerías de Mapa y Gráficas -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .dashboard { display: flex; gap: 20px; margin-top: 20px; }
        #mapa { height: 400px; width: 50%; border: 1px solid #ccc; }
        .grafica { width: 50%; }
        table { width: 100%; margin-top: 20px; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    </style>
</head>
<body>
    <h1>Plataforma Data-Driven: Calidad del Aire</h1>
    <button id="btn-obtener">Ejecutar Ingesta y ETL</button>
    
    <div class="dashboard">
        <div id="mapa"></div>
        <div class="grafica"><canvas id="graficaICA"></canvas></div>
    </div>

    <!-- Reporte Maestro/Detalle -->
    <table id="tabla-datos">
        <thead>
            <tr>
                <th>Estación</th><th>Temp (°C)</th><th>O3</th><th>PM2.5</th><th>ICA (KPI)</th><th>Calidad</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        var map = L.map('mapa').setView([19.58, -99.04], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        var myChart = null;

        document.getElementById('btn-obtener').addEventListener('click', function() {
            // Asegúrate de usar tu enlace de Render aquí:
            fetch('https://proyecto-arquitectura-web.onrender.com/api/datos')
                .then(res => res.json())
                .then(datos => {
                    let tbody = document.querySelector('#tabla-datos tbody');
                    tbody.innerHTML = '';
                    let nombres = [], valoresICA = [];

                    datos.forEach(item => {
                        tbody.innerHTML += `<tr>
                            <td>${item.estacion}</td><td>${item.temp}</td><td>${item.o3}</td>
                            <td>${item.pm25}</td><td><strong>${item.ICA}</strong></td><td>${item.categoria}</td>
                        </tr>`;
                        
                        L.marker([item.lat, item.lng]).addTo(map)
                            .bindPopup(`<b>${item.estacion}</b><br>ICA: ${item.ICA} (${item.categoria})`);
                        
                        nombres.push(item.estacion);
                        valoresICA.push(item.ICA);
                    });

                    if(myChart) myChart.destroy();
                    myChart = new Chart(document.getElementById('graficaICA'), {
                        type: 'bar',
                        data: {
                            labels: nombres,
                            datasets: [{ label: 'Índice de Calidad del Aire', data: valoresICA, backgroundColor: ['#ef4444', '#f59e0b', '#10b981'] }]
                        }
                    });
                });
        });
    </script>
</body>
</html>
